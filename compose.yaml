# One attack, three views, one pipeline: the lab.
# Order: scripts/fetch-vendor.sh -> docker compose up -d kafka kafka-init flowports -> scripts/flowports-setup.py
#        -> docker compose up -d datakit app nfs -> docker compose run --rm client
# APP_LANG (java|python) and ROUTE (a|b) come from .env. After changing either: docker compose up -d --build --force-recreate app nfs
name: flowports-lab

networks:
  lab: {}

services:
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    networks: [lab]
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    networks: [lab]
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
              "--topic", "${KAFKA_TOPIC:-lab-events}", "--partitions", "1", "--replication-factor", "1"]

  flowports:
    # The FlowPorts binary is downloaded and hash-checked by scripts/fetch-vendor.sh; it is not part of this repo.
    image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    networks: [lab]
    mem_limit: 1g
    ports:
      - "127.0.0.1:18080:8080"   # management UI and API, this machine only
    tmpfs:
      - /data:rw,size=1g
    volumes:
      - ./vendor/flowports:/opt/fp:ro
      - ./certs/ca-bundle.pem:/ca/ca-bundle.pem:ro
    environment:
      SSL_CERT_FILE: /ca/ca-bundle.pem  # the base image has no CA store; FlowPorts needs one for HTTPS to DataWay
    command: ["/opt/fp/collectway", "-data-dir", "/data", "-admin-listen", "0.0.0.0:8080", "-ingest-listen", "0.0.0.0:8081"]

  datakit:
    image: pubrepo.truewatch.com/truewatch/datakit:2.19.1@sha256:e409a78f25b92a8b533db7ed798f4f500f70a690f35039d5771bf7159c58955e
    networks: [lab]
    hostname: lab-datakit
    mem_limit: 1g
    depends_on: [flowports]
    env_file:
      - {path: .lab/datakit.env, required: false}   # ENV_DATAWAY=http://flowports:8081?flow=lab-dk&token=<source token>
    environment:
      ENV_DEFAULT_ENABLED_INPUTS: opentelemetry
      ENV_HTTP_LISTEN: 0.0.0.0:9529

  app:
    build: ./app/${APP_LANG:-java}
    image: flowports-lab/app-${APP_LANG:-java}:local
    networks: [lab]
    mem_limit: 1g
    env_file:
      - {path: ".lab/app-${ROUTE:-a}.env", required: false}   # OTLP endpoint (and token for route b)
    environment:
      OTEL_SERVICE_NAME: lab-app-${APP_LANG:-java}-${ROUTE:-a}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      BEACON_SECURITY_ENABLED: "true"
      BEACON_SECURITY_ANALYSIS_SQL_DIALECT: ansi
      BEACON_SECURITY_LOCAL_OUTPUT_ENABLED: "true"
      BEACON_SECURITY_EVIDENCE_FILE: /evidence/evidence.jsonl

  nfs:
    # NetFlowScout in network mode, inside the app container's network namespace, capturing tcp port 8080.
    image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    network_mode: "service:app"
    depends_on: [app]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    tmpfs:
      - /work:rw,size=256m
    volumes:
      - ./vendor/netflowscout:/opt/nfs:ro
      - ./netflowscout:/cfg:ro
    env_file:
      - {path: .lab/nfs.env, required: false}   # NETFLOWSCOUT_DATAWAY_TOKEN=<source token>
    command: ["sh", "-c", "mkdir -p /work/run /work/var && (/opt/nfs/bin/netflowscout run --config /cfg/netflowscout.json &) && sleep 3 && exec /opt/nfs/bin/netflowscout analyze --config /cfg/netflowscout.json"]

  client:
    image: python:3.12.7-slim@sha256:60d9996b6a8a3689d36db740b49f4327be3be09a21122bd02fb8895abb38b50d
    networks: [lab]
    profiles: [tools]
    volumes:
      - ./scripts/probe.py:/p/probe.py:ro
    environment:
      MODE: ${MODE:-story}
      ROUTE: ${PROBE_ROUTE:-a1}
    entrypoint: ["python3", "-I", "/p/probe.py"]
